[project]
name = "youtube-automation"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flask",
  "yt-dlp",
  "youtube-transcript-api",
  "imageio-ffmpeg",
  "soundfile",
  "qwen-tts==0.1.1",
  "torch",
  "torchaudio",
  "python-dotenv>=1.2.4",
  "requests>=2.34.2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
