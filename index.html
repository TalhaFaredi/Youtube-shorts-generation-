<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Extractor</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b2; --accent:#ff4d4d; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f6f8; --card:#fff; --line:#dfe2e8; --text:#1a1d24; --muted:#5f6877; --accent:#d62828; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1 1 320px; padding:12px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  input[type=number] { width:110px; padding:12px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  button { padding:12px 20px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); padding:6px 12px; font-weight:500; }
  button:disabled { opacity:.6; cursor:wait; }
  #status { margin:20px 0; color:var(--muted); }
  #status.err { color:var(--accent); }
  .meta h2 { margin:24px 0 2px; font-size:1.25rem; }
  .meta p { margin:0; color:var(--muted); }
  .tabs { display:flex; gap:8px; margin:20px 0 12px; }
  .tabs button { background:transparent; color:var(--muted); border:1px solid var(--line); padding:8px 16px; }
  .tabs button.on { background:var(--card); color:var(--text); border-color:var(--accent); }
  .row { display:grid; grid-template-columns:260px 1fr; gap:16px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  .row img { width:100%; border-radius:6px; display:block; }
  .row a.t { display:inline-block; margin-top:6px; font-size:.85rem; color:var(--accent); text-decoration:none; font-variant-numeric:tabular-nums; }
  .row p { margin:0; white-space:pre-wrap; }
  .row .none { color:var(--muted); font-style:italic; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .grid figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .grid img { width:100%; display:block; }
  .grid figcaption { padding:6px 10px; font-size:.85rem; }
  .grid a { color:var(--accent); text-decoration:none; }
  textarea { width:100%; min-height:380px; padding:14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; resize:vertical; }
  .bar { display:flex; justify-content:flex-end; margin-bottom:8px; }
  [hidden] { display:none !important; }
  @media (max-width:640px) { .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1>YouTube Extractor</h1>
  <p class="sub">Paste a YouTube link to get the transcript and frames pulled from the video.</p>

  <form id="f">
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
    <input type="number" id="interval" min="1" placeholder="Every N s" title="Seconds between frames (blank = auto)">
    <button id="go">Extract</button>
  </form>
  <div id="status"></div>

  <section id="out" hidden>
    <div class="meta"><h2 id="title"></h2><p id="info"></p></div>
    <div class="tabs">
      <button data-tab="timeline" class="on">Timeline</button>
      <button data-tab="text">Full text</button>
      <button data-tab="frames">Frames only</button>
    </div>
    <div id="timeline"></div>
    <div id="text" hidden>
      <div class="bar"><button class="ghost" id="copy">Copy text</button></div>
      <textarea id="ta" readonly></textarea>
    </div>
    <div id="frames" class="grid" hidden></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.floor(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['timeline','text','frames'].forEach(t => $(t).hidden = t !== b.dataset.tab);
});

$('copy').onclick = async () => {
  await navigator.clipboard.writeText($('ta').value);
  $('copy').textContent = 'Copied!'; setTimeout(() => $('copy').textContent = 'Copy text', 1500);
};

$('f').onsubmit = async e => {
  e.preventDefault();
  const st = $('status'), go = $('go');
  st.className = ''; st.textContent = 'Working… downloading a low-res copy and extracting frames (can take a minute).';
  go.disabled = true; $('out').hidden = true;
  try {
    const r = await fetch('/api/extract', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ url: $('url').value, interval: $('interval').value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Request failed');
    render(d);
    st.textContent = d.transcript_error || '';
    if (d.transcript_error) st.className = 'err';
  } catch (err) { st.className = 'err'; st.textContent = err.message; }
  go.disabled = false;
};

function render(d) {
  const link = t => `https://www.youtube.com/watch?v=${d.video_id}&t=${Math.floor(t)}s`;
  $('title').textContent = d.title || d.video_id;
  $('info').textContent = [d.channel, d.duration && fmt(d.duration), `${d.frames.length} frames, 1 every ${d.interval}s`].filter(Boolean).join(' · ');

  // timeline: frame + the transcript text spoken until the next frame
  const tl = $('timeline'); tl.innerHTML = '';
  d.frames.forEach((fr, i) => {
    const end = i + 1 < d.frames.length ? d.frames[i+1].time : Infinity;
    const words = d.transcript.filter(s => s.start >= fr.time && s.start < end).map(s => s.text).join(' ');
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<div><img loading="lazy" src="${fr.url}"><a class="t" target="_blank" href="${link(fr.time)}">▶ ${fmt(fr.time)}</a></div><p></p>`;
    const p = row.querySelector('p');
    if (words) p.textContent = words; else { p.textContent = 'No speech in this section.'; p.className = 'none'; }
    tl.appendChild(row);
  });

  $('ta').value = d.transcript.map(s => `[${fmt(s.start)}] ${s.text}`).join('\n') || '(no transcript available)';

  $('frames').innerHTML = d.frames.map(fr =>
    `<figure><a href="${fr.url}" target="_blank"><img loading="lazy" src="${fr.url}"></a><figcaption><a target="_blank" href="${link(fr.time)}">▶ ${fmt(fr.time)}</a></figcaption></figure>`).join('');

  $('out').hidden = false;
}
</script>
</body>
</html>
